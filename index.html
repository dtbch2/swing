<style>
  :root{
    --bg:#0a0e17; --bg2:#10151f; --panel:#141b28; --panel2:#1a2233;
    --line:#27314a; --line2:#323e5c;
    --txt:#e7ecf6; --muted:#8b95ad; --dim:#5d6885;
    --up:#2ee6a0; --down:#ff5c6c; --warn:#ffb84d; --info:#4dd4ff; --accent:#7c9eff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--txt);font-family:'Noto Sans SC',sans-serif;font-size:15px;line-height:1.5}
  body{
    background-image:
      radial-gradient(circle at 85% -5%, rgba(46,230,160,.06), transparent 45%),
      radial-gradient(circle at 0% 100%, rgba(124,158,255,.06), transparent 40%);
    min-height:100vh;
    padding:calc(18px + env(safe-area-inset-top)) 14px calc(80px + env(safe-area-inset-bottom));
  }
  .mono{font-family:'JetBrains Mono',monospace}
  .wrap{max-width:560px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#2ee6a0,#4dd4ff);display:grid;place-items:center;font-weight:700;color:#0a0e17;font-family:'JetBrains Mono'}
  h1{font-size:17px;font-weight:700;letter-spacing:.02em}
  .sub{font-size:11px;color:var(--dim);letter-spacing:.18em;text-transform:uppercase;font-family:'JetBrains Mono'}
  .summary{display:flex;gap:10px;margin-bottom:14px}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .stat .k{font-size:11px;color:var(--muted);margin-bottom:3px}
  .stat .v{font-size:18px;font-weight:700}
  .tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:14px}
  .tab{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer;transition:.15s}
  .tab.active{background:var(--panel2);color:var(--txt);font-weight:600}
  .tab .cnt{font-family:'JetBrains Mono';font-size:11px;opacity:.7;margin-left:3px}
  .addbtn{width:100%;background:var(--panel);border:1px dashed var(--line2);color:var(--accent);padding:13px;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
  .addbtn:active{transform:scale(.99);background:var(--panel2)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  .card.win::before{background:var(--up)} .card.lose::before{background:var(--down)} .card.watch::before{background:var(--accent)}
  .crow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .tkr{font-family:'JetBrains Mono';font-weight:700;font-size:20px;letter-spacing:.02em}
  .nm{font-size:12px;color:var(--muted);margin-top:1px}
  .pnl{text-align:right;font-family:'JetBrains Mono'}
  .pnl .big{font-size:20px;font-weight:700}
  .pnl .amt{font-size:12px;color:var(--muted)}
  .wbadge{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(124,158,255,.15);color:var(--accent);border:1px solid rgba(124,158,255,.3);font-family:'Noto Sans SC'}
  .up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)}
  .priceline{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0 4px;font-family:'JetBrains Mono';font-size:13px}
  .priceline .seg{display:flex;flex-direction:column}
  .priceline .lbl{font-size:10px;color:var(--dim);font-family:'Noto Sans SC';margin-bottom:1px}
  .curinput{background:var(--bg2);border:1px solid var(--line2);color:var(--up);font-family:'JetBrains Mono';font-size:14px;font-weight:700;width:88px;padding:4px 8px;border-radius:7px}
  .curinput:focus{outline:none;border-color:var(--up)}
  .track-wrap{margin:18px 0 8px}
  .track{position:relative;height:6px;background:linear-gradient(90deg,rgba(255,92,108,.5),rgba(139,149,173,.25) 40%,rgba(46,230,160,.5));border-radius:3px;margin:34px 6px 40px}
  .mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:2px;height:16px}
  .mk.cur{width:3px;height:22px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.7);z-index:5}
  .mk.stop{background:var(--down)} .mk.cost{background:var(--dim)} .mk.tgt{background:var(--up)}
  .mk .tag{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:'JetBrains Mono';font-size:10px}
  .mk.cur .tag{top:-26px;color:#fff;font-weight:700;font-size:12px}
  .mk.stop .tag{bottom:-30px;color:var(--down)}
  .mk.cost .tag{bottom:-30px;color:var(--dim)}
  .mk.tgt .tag{top:-26px;color:var(--up)}
  .mk .tag small{display:block;font-size:8px;opacity:.8;text-align:center}
  .status{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:9px;font-size:13px;margin-top:6px}
  .status.hold{background:rgba(124,158,255,.1);color:var(--accent)}
  .status.profit{background:rgba(46,230,160,.1);color:var(--up)}
  .status.danger{background:rgba(255,92,108,.12);color:var(--down)}
  .status .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .meta{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
  .chip{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .tgts{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .tgt-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;cursor:pointer}
  .tgt-row .box{width:18px;height:18px;border:1.5px solid var(--line2);border-radius:5px;flex-shrink:0;display:grid;place-items:center;font-size:12px;color:var(--up)}
  .tgt-row.done .box{background:var(--up);border-color:var(--up);color:#0a0e17}
  .tgt-row.done .px{text-decoration:line-through;color:var(--dim)}
  .tgt-row .px{font-family:'JetBrains Mono';font-weight:500}
  .tgt-row .sl{margin-left:auto;color:var(--muted);font-size:12px}
  .notes{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.6;background:var(--bg2);padding:9px 11px;border-radius:8px}
  .cardacts{display:flex;gap:8px;margin-top:12px}
  .mini{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:8px;border-radius:8px;font-size:13px;cursor:pointer}
  .mini:active{background:var(--line)}
  .mini.move{color:var(--accent)} .mini.del{color:var(--down)}
  .overlay{position:fixed;inset:0;background:rgba(5,8,14,.72);backdrop-filter:blur(4px);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  .sheet{background:var(--bg2);border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom));animation:slideup .25s ease}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet h2{font-size:17px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
  .closex{background:var(--panel2);border:1px solid var(--line);color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:18px;cursor:pointer}
  .seg2{display:flex;gap:8px;margin-bottom:15px}
  .seg2 .opt{flex:1;text-align:center;padding:11px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);cursor:pointer;font-size:15px}
  .seg2 .opt.on{border-color:var(--accent);background:rgba(124,158,255,.12);color:var(--accent);font-weight:600}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--txt);padding:10px 12px;border-radius:9px;font-size:16px;font-family:'JetBrains Mono'}
  .field textarea{font-family:'Noto Sans SC';font-size:14px;resize:vertical;min-height:54px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
  .row2{display:flex;gap:10px}.row2 .field{flex:1}
  .row3{display:flex;gap:8px}.row3 .field{flex:1}
  .gbtn{width:100%;background:rgba(124,158,255,.12);border:1px solid var(--accent);color:var(--accent);padding:9px;border-radius:9px;font-size:13px;cursor:pointer;margin-bottom:6px}
  .gbtn:active{background:rgba(124,158,255,.2)}
  .ghint{font-size:11px;color:var(--dim);margin-bottom:12px;line-height:1.5}
  .tgtedit{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:13px}
  .tgtedit .te-row{display:flex;gap:8px;align-items:center;margin-bottom:7px}
  .tgtedit .te-row input{flex:1}
  .tgtedit .rm{background:rgba(255,92,108,.12);border:1px solid rgba(255,92,108,.3);color:var(--down);width:34px;height:38px;border-radius:8px;font-size:16px;cursor:pointer;flex-shrink:0}
  .addtgt{width:100%;background:var(--panel2);border:1px dashed var(--line2);color:var(--muted);padding:8px;border-radius:8px;font-size:13px;cursor:pointer}
  .save{width:100%;background:linear-gradient(135deg,#2ee6a0,#4dd4ff);color:#06121d;font-weight:700;padding:14px;border-radius:11px;font-size:16px;cursor:pointer;margin-top:8px;border:none}
  .save:active{opacity:.9}
  .empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:14px}
  .disc{font-size:11px;color:var(--dim);text-align:center;margin-top:20px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">波</div>
      <div><h1>波段追踪</h1><div class="sub">Swing Tracker</div></div>
    </div>
  </header>
  <div class="summary" id="summary"></div>
  <div class="tabs" id="tabs"></div>
  <button class="addbtn" onclick="openForm()">＋ 添加</button>
  <div id="list"></div>
  <div class="disc">数据保存在本机 · 当前价手动更新 · 仅为策略管理工具，不构成投资建议</div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2><span id="formTitle">添加</span><button class="closex" onclick="closeForm()">×</button></h2>
    <div class="seg2">
      <div class="opt on" id="grp_hold" onclick="setGroup('持仓')">📦 持仓（已买）</div>
      <div class="opt" id="grp_watch" onclick="setGroup('关注')">👀 关注（盯着）</div>
    </div>
    <div class="row2">
      <div class="field"><label>代码</label><input id="f_tkr" placeholder="MSFT" style="text-transform:uppercase"></div>
      <div class="field"><label>名称（选填）</label><input id="f_nm" placeholder="微软" style="font-family:'Noto Sans SC'"></div>
    </div>
    <div class="row3">
      <div class="field"><label id="lbl_cost">成本价</label><input id="f_cost" type="number" inputmode="decimal" placeholder="78.0"></div>
      <div class="field"><label>当前价</label><input id="f_cur" type="number" inputmode="decimal" placeholder="94.3"></div>
      <div class="field"><label id="lbl_sh">股数（选填）</label><input id="f_sh" type="number" inputmode="numeric" placeholder="100"></div>
    </div>
    <div class="field"><label>策略类型</label>
      <select id="f_strat" style="font-family:'Noto Sans SC'">
        <option>目标位分批</option><option>移动止损</option><option>分批止盈</option><option>长期持有</option>
      </select>
    </div>
    <div class="field"><label id="lbl_stop">止损位</label><input id="f_stop" type="number" inputmode="decimal" placeholder="80.0"></div>
    <div class="row2">
      <div class="field"><label>前高（算反弹位用）</label><input id="f_high" type="number" inputmode="decimal" placeholder="139.75"></div>
      <div class="field"><label>前低</label><input id="f_low" type="number" inputmode="decimal" placeholder="63.5"></div>
    </div>
    <button class="gbtn" onclick="autoFib()">⚡ 用黄金分割自动算目标位</button>
    <div class="ghint">输入前高、前低后点击，自动填入 0.382 / 0.5 / 0.618 / 1.0 反弹位作为分批目标。</div>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px">目标位 / 减仓计划</label>
    <div class="tgtedit" id="tgtEdit"></div>
    <button class="addtgt" onclick="addTgtRow()">＋ 增加一个目标位</button>
    <div class="field" style="margin-top:13px"><label>备注 / 策略逻辑</label><textarea id="f_notes" placeholder="例：放量突破箱体，KDJ超买注意回踩，不破止损位继续拿"></textarea></div>
    <button class="save" onclick="saveForm()">保存</button>
  </div>
</div>

<script>
let positions=[];
let editingId=null;
let activeTab='全部';
let formGroup='持仓';
const KEY='swing_positions_v1';
const cloud = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function') ? window.storage : null;

const seed = {
  id:'hood-demo', tkr:'HOOD', nm:'Robinhood', group:'持仓', cost:78, cur:94.30, sh:100,
  strat:'目标位分批', stop:80, high:139.75, low:63.515,
  targets:[{price:101.6,sell:25},{price:110.6,sell:25},{price:139.75,sell:50}],
  notes:'底部箱体放量突破，KDJ超买注意短线回踩，不破80算健康。⚠️成本价是示例，请改成你的真实成本。',
  hits:[false,false,false]
};

async function readStore(){
  if(cloud){ try{ const r=await cloud.get(KEY); if(r&&r.value) return r.value; }catch(e){} }
  try{ const v=localStorage.getItem(KEY); if(v) return v; }catch(e){}
  return null;
}
function writeStore(val){
  if(cloud){ try{ cloud.set(KEY,val); }catch(e){} }
  try{ localStorage.setItem(KEY,val); }catch(e){}
}
async function load(){
  let v=null;
  try{ v=await readStore(); }catch(e){}
  if(v){ try{ positions=JSON.parse(v); positions.forEach(p=>{ if(!p.group)p.group='持仓'; }); }catch(e){ positions=[seed]; } }
  else { positions=[seed]; save(); }
  render();
}
function save(){ writeStore(JSON.stringify(positions)); }

function fmt(n){ if(n===''||n===null||n===undefined||isNaN(n))return '--'; return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function statusOf(p){
  const cur=+p.cur;
  const ts=p.targets.map((t,i)=>({...t,i})).sort((a,b)=>a.price-b.price);
  if(p.group==='关注'){
    const next=ts.find(t=>cur<t.price);
    if(next){ const d=((next.price-cur)/cur*100).toFixed(1); return {c:'hold',t:`关注中 · 距目标 ${fmt(next.price)} 还有 ${d}%`}; }
    if(ts.length) return {c:'profit',t:'关注中 · 已超过设定目标位'};
    return {c:'hold',t:'关注中 · 等待入场信号'};
  }
  if(p.stop && cur<=+p.stop) return {c:'danger',t:`已触及止损位 ${fmt(p.stop)}，按纪律应离场`};
  const hitNow=ts.find(t=>!p.hits[t.i] && cur>=t.price);
  if(hitNow) return {c:'profit',t:`已到目标位 ${fmt(hitNow.price)}，计划减仓 ${hitNow.sell}%（点下方勾选已执行）`};
  const next=ts.find(t=>cur<t.price);
  if(next){ const d=((next.price-cur)/cur*100).toFixed(1); return {c:'hold',t:`持有中 · 距下一目标 ${fmt(next.price)} 还有 ${d}%`}; }
  return {c:'profit',t:'已超过所有目标位，建议落袋或上移止损保护利润'};
}

function ladder(p){
  const prices=[+p.stop,+p.cost,+p.cur,...p.targets.map(t=>+t.price)].filter(v=>!isNaN(v)&&v>0);
  if(prices.length<2) return '';
  let min=Math.min(...prices), max=Math.max(...prices);
  const pad=(max-min)*0.08||1; min-=pad; max+=pad;
  const pos=v=>Math.max(0,Math.min(100,(v-min)/(max-min)*100));
  let mk='';
  if(p.stop) mk+=`<div class="mk stop" style="left:${pos(+p.stop)}%"><div class="tag">${p.group==='关注'?'参考':'止损'}<br><small>${fmt(p.stop)}</small></div></div>`;
  if(p.cost) mk+=`<div class="mk cost" style="left:${pos(+p.cost)}%"><div class="tag">${p.group==='关注'?'目标价':'成本'}<br><small>${fmt(p.cost)}</small></div></div>`;
  p.targets.forEach((t,i)=>{ if(!p.hits[i]) mk+=`<div class="mk tgt" style="left:${pos(+t.price)}%"><div class="tag">${fmt(t.price)}<small>${p.group==='关注'?'目标':'卖'+t.sell+'%'}</small></div></div>`; });
  mk+=`<div class="mk cur" style="left:${pos(+p.cur)}%"><div class="tag">现价 ${fmt(p.cur)}</div></div>`;
  return `<div class="track-wrap"><div class="track">${mk}</div></div>`;
}

function render(){
  const hold = positions.filter(p=>p.group!=='关注');
  const watch = positions.filter(p=>p.group==='关注');
  let totalCost=0,totalNow=0,hasShares=false;
  hold.forEach(p=>{ if(p.sh){hasShares=true; totalCost+=(+p.cost)*(+p.sh); totalNow+=(+p.cur)*(+p.sh);} });
  const pnl=totalNow-totalCost, pnlPct=totalCost?pnl/totalCost*100:0;
  document.getElementById('summary').innerHTML=`
    <div class="stat"><div class="k">持仓数量</div><div class="v mono">${hold.length}</div></div>
    <div class="stat"><div class="k">总浮动盈亏</div><div class="v mono ${pnl>=0?'up':'down'}">${hasShares?(pnl>=0?'+':'')+fmt(pnl):'--'}</div></div>
    <div class="stat"><div class="k">综合收益率</div><div class="v mono ${pnlPct>=0?'up':'down'}">${hasShares?(pnlPct>=0?'+':'')+pnlPct.toFixed(1)+'%':'--'}</div></div>`;

  document.getElementById('tabs').innerHTML=
    [['全部',positions.length],['持仓',hold.length],['关注',watch.length]]
    .map(([t,c])=>`<div class="tab ${activeTab===t?'active':''}" onclick="setTab('${t}')">${t}<span class="cnt">${c}</span></div>`).join('');

  let shown = positions;
  if(activeTab==='持仓') shown=hold;
  else if(activeTab==='关注') shown=watch;

  const list=document.getElementById('list');
  if(shown.length===0){
    const msg = activeTab==='关注'?'还没有关注的股票<br>点上方「添加」，类型选「关注」':(activeTab==='持仓'?'还没有持仓<br>点上方「添加」记录你买入的票':'还没有任何记录<br>点上方按钮添加第一只');
    list.innerHTML=`<div class="empty">${msg}</div>`; return;
  }
  list.innerHTML=shown.map(p=>{
    const isWatch=p.group==='关注';
    const pnlPct=p.cost?((+p.cur-+p.cost)/+p.cost*100):0;
    const pnlAmt=p.sh?(+p.cur-+p.cost)*+p.sh:null;
    const win=pnlPct>=0; const st=statusOf(p);
    const tgtRows=p.targets.map((t,i)=>`
      <div class="tgt-row ${p.hits[i]?'done':''}" onclick="toggleHit('${p.id}',${i})">
        <div class="box">${p.hits[i]?'✓':''}</div><span class="px">${fmt(t.price)}</span><span class="sl">${isWatch?'目标价':'减仓 '+t.sell+'%'}</span>
      </div>`).join('');
    const corner = isWatch
      ? `<span class="wbadge">👀 关注</span>`
      : `<div class="big ${win?'up':'down'}">${win?'+':''}${pnlPct.toFixed(2)}%</div>${pnlAmt!==null?`<div class="amt ${win?'up':'down'}">${win?'+':''}${fmt(pnlAmt)}</div>`:''}`;
    return `<div class="card ${isWatch?'watch':(win?'win':'lose')}">
      <div class="crow">
        <div><div class="tkr">${p.tkr}</div>${p.nm?`<div class="nm">${p.nm}</div>`:''}</div>
        <div class="pnl">${corner}</div>
      </div>
      <div class="priceline">
        <div class="seg"><span class="lbl">当前价（可改）</span><input class="curinput" type="number" inputmode="decimal" value="${p.cur}" onchange="setCur('${p.id}',this.value)"></div>
        <div class="seg"><span class="lbl">${isWatch?'目标价':'成本'}</span><span style="padding-top:5px;color:var(--muted)">${fmt(p.cost)}</span></div>
        <div class="seg"><span class="lbl">${isWatch?'参考位':'止损'}</span><span style="padding-top:5px;color:var(--down)">${fmt(p.stop)}</span></div>
      </div>
      ${ladder(p)}
      <div class="status ${st.c}"><span class="dot"></span><span>${st.t}</span></div>
      <div class="meta"><span class="chip">📋 ${p.strat}</span>${p.high&&p.low?`<span class="chip">区间 ${fmt(p.low)}–${fmt(p.high)}</span>`:''}</div>
      ${p.targets.length?`<div class="tgts">${tgtRows}</div>`:''}
      ${p.notes?`<div class="notes">${p.notes}</div>`:''}
      <div class="cardacts">
        <button class="mini" onclick="openForm('${p.id}')">编辑</button>
        <button class="mini move" onclick="toggleGroup('${p.id}')">${isWatch?'转为持仓':'转为关注'}</button>
        <button class="mini del" onclick="delPos('${p.id}')">删除</button>
      </div>
    </div>`;
  }).join('');
}

function setTab(t){ activeTab=t; render(); }
function setCur(id,v){ const p=positions.find(x=>x.id===id); if(p){p.cur=+v; save(); render();} }
function toggleHit(id,i){ const p=positions.find(x=>x.id===id); if(p){p.hits[i]=!p.hits[i]; save(); render();} }
function toggleGroup(id){ const p=positions.find(x=>x.id===id); if(p){ p.group=(p.group==='关注'?'持仓':'关注'); save(); render(); } }
function delPos(id){ const p=positions.find(x=>x.id===id); if(confirm(`确定删除 ${p?p.tkr:''}？`)){ positions=positions.filter(x=>x.id!==id); save(); render(); } }

let formTargets=[];
function setGroup(g){
  formGroup=g;
  document.getElementById('grp_hold').classList.toggle('on',g==='持仓');
  document.getElementById('grp_watch').classList.toggle('on',g==='关注');
  document.getElementById('lbl_cost').textContent = g==='关注'?'目标价（选填）':'成本价';
  document.getElementById('lbl_sh').textContent = g==='关注'?'股数（不适用）':'股数（选填）';
  document.getElementById('lbl_stop').textContent = g==='关注'?'参考/入场位（选填）':'止损位';
}
function renderTgtEdit(){
  const box=document.getElementById('tgtEdit');
  if(formTargets.length===0){ box.innerHTML='<div style="font-size:12px;color:var(--dim)">暂无目标位，点下方添加或用黄金分割自动算</div>'; return; }
  box.innerHTML=formTargets.map((t,i)=>`
    <div class="te-row">
      <input type="number" inputmode="decimal" placeholder="目标价" value="${t.price??''}" onchange="formTargets[${i}].price=+this.value">
      <input type="number" inputmode="numeric" placeholder="减仓%" value="${t.sell??''}" onchange="formTargets[${i}].sell=+this.value" style="max-width:90px">
      <button class="rm" onclick="rmTgt(${i})">×</button>
    </div>`).join('');
}
function addTgtRow(){ formTargets.push({price:'',sell:25}); renderTgtEdit(); }
function rmTgt(i){ formTargets.splice(i,1); renderTgtEdit(); }
function autoFib(){
  const h=+document.getElementById('f_high').value, l=+document.getElementById('f_low').value;
  if(!h||!l||h<=l){ alert('请先正确填写前高和前低（前高需大于前低）'); return; }
  const r=h-l;
  formTargets=[
    {price:+(l+0.382*r).toFixed(2),sell:25},
    {price:+(l+0.5*r).toFixed(2),sell:25},
    {price:+(l+0.618*r).toFixed(2),sell:25},
    {price:+h.toFixed(2),sell:25},
  ];
  renderTgtEdit();
}

function openForm(id){
  editingId=id||null;
  const g=k=>document.getElementById(k);
  if(id){
    const p=positions.find(x=>x.id===id);
    document.getElementById('formTitle').textContent='编辑';
    setGroup(p.group||'持仓');
    g('f_tkr').value=p.tkr; g('f_nm').value=p.nm||''; g('f_cost').value=p.cost||''; g('f_cur').value=p.cur;
    g('f_sh').value=p.sh||''; g('f_strat').value=p.strat; g('f_stop').value=p.stop||'';
    g('f_high').value=p.high||''; g('f_low').value=p.low||''; g('f_notes').value=p.notes||'';
    formTargets=p.targets.map(t=>({...t}));
  } else {
    document.getElementById('formTitle').textContent='添加';
    setGroup(activeTab==='关注'?'关注':'持仓');
    ['f_tkr','f_nm','f_cost','f_cur','f_sh','f_stop','f_high','f_low','f_notes'].forEach(k=>g(k).value='');
    g('f_strat').value='目标位分批'; formTargets=[];
  }
  renderTgtEdit();
  document.getElementById('overlay').classList.add('show');
}
function closeForm(){ document.getElementById('overlay').classList.remove('show'); }

function saveForm(){
  const g=k=>document.getElementById(k).value;
  const tkr=g('f_tkr').trim().toUpperCase();
  if(!tkr){ alert('请填写股票代码'); return; }
  if(!g('f_cur')){ alert('请填写当前价'); return; }
  const tgts=formTargets.filter(t=>t.price&&!isNaN(t.price)).map(t=>({price:+t.price,sell:+t.sell||0}));
  const obj={ tkr, nm:g('f_nm').trim(), group:formGroup, cost:+g('f_cost')||0, cur:+g('f_cur')||0, sh:+g('f_sh')||0,
    strat:g('f_strat'), stop:+g('f_stop')||0, high:+g('f_high')||0, low:+g('f_low')||0,
    targets:tgts, notes:document.getElementById('f_notes').value.trim() };
  if(editingId){
    const p=positions.find(x=>x.id===editingId);
    const oldHits=p.hits||[]; Object.assign(p,obj); p.hits=tgts.map((_,i)=>oldHits[i]||false);
  } else { obj.id='p'+Date.now(); obj.hits=tgts.map(()=>false); positions.push(obj); }
  activeTab=formGroup;
  save(); closeForm(); render();
}

document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeForm(); });
load();
</script>
</body>
</html>
